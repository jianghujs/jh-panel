<style>
.ms-page{height:100%;}
.ms-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;}
.ms-title{font-size:15px;font-weight:600;color:#222;}
.ms-sub{font-size:12px;color:#888;line-height:20px;}
.ms-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px;}
.ms-card{border:1px solid #e8ebf0;border-radius:4px;background:#fff;padding:12px;min-height:82px;}
.ms-card-label{font-size:12px;color:#888;}
.ms-card-value{font-size:22px;line-height:30px;font-weight:600;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ms-card-note{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ms-card.normal{border-left:4px solid #5cb85c;}
.ms-card.warn{border-left:4px solid #f0ad4e;}
.ms-card.danger{border-left:4px solid #d9534f;}
.ms-card.info{border-left:4px solid #337ab7;}
.ms-panel{border:1px solid #e8ebf0;border-radius:4px;background:#fff;}
.ms-panel-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f4;padding:12px 14px;}
.ms-panel-body{padding:14px;}
.ms-overview-table{margin-bottom:0;}
.ms-overview-table th,.ms-overview-table td{vertical-align:middle!important;}
.ms-overview-table th{width:120px;color:#777;font-weight:normal;background:#fafafa;}
.ms-overview-actions{display:flex;gap:6px;justify-content:flex-end;align-items:center;}
.ms-status-pill{display:inline-block;min-width:64px;text-align:center;border-radius:3px;padding:3px 8px;font-size:12px;border:1px solid transparent;}
.ms-pill-normal{color:#2e7d32;background:#f0fff0;border-color:#bfe4bf;}
.ms-pill-warn{color:#9a6200;background:#fff7e6;border-color:#f1d399;}
.ms-pill-danger{color:#b02a25;background:#fff1f0;border-color:#f0c6c4;}
.ms-pill-info{color:#245580;background:#eef7ff;border-color:#b8d7ef;}
.ms-host-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.ms-host{border:1px solid #e9edf2;background:#fbfcfd;border-radius:4px;padding:12px;min-height:112px;}
.ms-host.master{border-color:#bfe4bf;background:#f9fff9;}
.ms-host.warn{border-color:#f1d399;background:#fffdf6;}
.ms-host-name{font-weight:600;font-size:14px;color:#222;line-height:22px;}
.ms-host-meta{font-size:12px;color:#777;line-height:20px;}
.ms-health-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.ms-health{border:1px solid #edf0f4;border-radius:4px;padding:10px;min-height:68px;}
.ms-health-label{font-size:12px;color:#888;}
.ms-health-value{font-size:13px;color:#333;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ms-check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.ms-check-card{border:1px solid #e6e9ef;border-radius:4px;background:#fff;overflow:hidden;}
.ms-check-card-disabled{background:#fafafa;border-color:#eceff3;}
.ms-check-card-disabled .ms-check-head{background:#f7f8fa;}
.ms-check-card-disabled .ms-check-table th,.ms-check-card-disabled .ms-check-table td,.ms-check-card-disabled .ms-check-name,.ms-check-card-disabled .ms-host-name{color:#999!important;}
.ms-check-head{height:48px;padding:10px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #edf0f4;}
.ms-check-table{width:100%;margin-bottom:0;table-layout:fixed;}
.ms-check-status-col{width:260px;}
.ms-check-table th,.ms-check-table td{vertical-align:middle!important;}
.ms-check-group-row td{background:#f7f8fa;color:#666;font-weight:600;}
.ms-check-name{color:#333;}
.ms-check-status-head{text-align:left;}
.ms-check-actual{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px;}
.ms-check-actual-pass{color:#2e7d32;}
.ms-check-actual-fail{color:#b02a25;}
.ms-check-icon{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;margin-right:6px;font-size:12px;}
.ms-check-pass{color:#2e7d32;background:#f0fff0;}
.ms-check-warn{color:#9a6200;background:#fff7e6;}
.ms-check-unknown{color:#777;background:#f1f3f5;}
.ms-check-fail{color:#b02a25;background:#fff1f0;}
.ms-role-mark{display:inline-block;min-width:22px;text-align:center;border-radius:3px;padding:2px 5px;font-size:12px;line-height:16px;}
.ms-role-master{color:#2e7d32;background:#f0fff0;border:1px solid #bfe4bf;}
.ms-role-standby{color:#245580;background:#eef7ff;border:1px solid #b8d7ef;}
.ms-role-disabled{color:#999;background:#f5f5f5;border:1px solid #ddd;}
.ms-current-site-tag{display:inline-block;border:1px solid #b8d7ef;background:#eef7ff;color:#245580;border-radius:3px;padding:2px 6px;font-size:12px;line-height:16px;}
.ms-host-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5cb85c;flex:0 0 auto;}
.ms-host-dot-switching{background:#f0ad4e;animation:msBlink 1.1s ease-in-out infinite;box-shadow:0 0 0 2px rgba(240,173,78,.18);}
.ms-host-dot-offline{background:#d9534f;}
.ms-host-dot-unbound{background:#b8bec6;}
.ms-host-name-offline{color:#999;}
.ms-loading-state{display:inline-flex;align-items:center;gap:5px;color:#9a6200;font-size:12px;line-height:18px;vertical-align:middle;}
.ms-loading-icon{display:inline-block;width:12px;height:12px;border:2px solid #f1d399;border-top-color:#f0ad4e;border-radius:50%;animation:msSpin .8s linear infinite;box-sizing:border-box;}
@keyframes msBlink{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes msSpin{to{transform:rotate(360deg);}}
.ms-form .line .tname{width:130px;}
.ms-form .bt-input-text{height:30px;}
.ms-switch-hosts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px;}
.ms-switch-risk-tip{border:1px solid #f0c6c4;background:#fff7f6;color:#555;border-radius:4px;padding:8px 10px;margin:0 0 12px 0;line-height:22px;font-size:12px;}
.ms-switch-risk-tip span{color:#d9534f;font-weight:600;}
.ms-switch-host{display:block;border:1px solid #e6e9ef;border-radius:4px;background:#fff;padding:10px 12px;font-weight:normal;cursor:pointer;}
.ms-switch-host input{margin-right:6px;}
.ms-switch-host-name{font-weight:600;color:#333;}
.ms-switch-host-meta{font-size:12px;color:#888;line-height:20px;margin-left:21px;}
.ms-switch-options{border:1px solid #e6e9ef;border-radius:4px;background:#fff;padding:12px;margin-top:10px;}
.ms-switch-options-title{font-weight:600;color:#333;margin-bottom:10px;}
.ms-sync-group{border:1px solid #edf0f4;background:#fafbfc;border-radius:4px;padding:10px;margin-top:10px;}
.ms-sync-options{display:none;}
.ms-sync-field{display:flex;align-items:center;margin-top:8px;}
.ms-sync-field:first-child{margin-top:0;}
.ms-sync-field span{width:78px;color:#777;}
.ms-sync-field .bt-input-text{width:460px;}
.ms-option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;}
.ms-option-check{display:flex;align-items:center;height:26px;margin:0;font-weight:normal;color:#555;line-height:26px;}
.ms-option-check input{margin:0 8px 0 0;flex:0 0 auto;}
.ms-switch-wizard{padding:14px;background:#fff;}
.ms-wizard-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px;}
.ms-wizard-step{border:1px solid #e6e9ef;border-radius:4px;background:#fafbfc;padding:9px 10px;color:#777;}
.ms-wizard-step.active{border-color:#8dbde8;background:#eef7ff;color:#245580;}
.ms-wizard-step.done{border-color:#bfe4bf;background:#f6fff6;color:#2e7d32;}
.ms-wizard-step-num{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:#dfe4ea;color:#666;font-size:12px;margin-right:6px;}
.ms-wizard-step.active .ms-wizard-step-num{background:#337ab7;color:#fff;}
.ms-wizard-step.done .ms-wizard-step-num{background:#5cb85c;color:#fff;}
.ms-wizard-body{min-height:300px;}
.ms-wizard-actions{border-top:1px solid #edf0f4;margin-top:12px;padding-top:12px;text-align:right;}
.ms-wizard-actions .btn{margin-left:6px;}
.ms-log-box{height:320px;background:#1f2329;color:#d7dde8;border-radius:4px;padding:12px;overflow:auto;font-family:Menlo,Consolas,monospace;font-size:12px;line-height:20px;white-space:pre-wrap;}
.ms-live-log-wrap{padding:14px;background:#fff;}
.ms-live-log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:#777;font-size:12px;}
.ms-live-state{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:3px 8px;border:1px solid transparent;font-size:12px;line-height:16px;}
.ms-live-state-running{color:#9a6200;background:#fff7e6;border-color:#f1d399;}
.ms-live-state-success{color:#2e7d32;background:#f0fff0;border-color:#bfe4bf;}
.ms-live-state-failed{color:#b02a25;background:#fff1f0;border-color:#f0c6c4;}
.ms-live-state-running:before{content:"";display:inline-block;width:11px;height:11px;border:2px solid #f1d399;border-top-color:#f0ad4e;border-radius:50%;animation:msSpin .8s linear infinite;box-sizing:border-box;}
.ms-live-run-id{font-family:Menlo,Consolas,monospace;color:#999;}
.ms-live-log-box{margin:0;height:420px;text-align:left;background:#000;color:#fff;white-space:pre-wrap;border:0;border-radius:3px;padding:10px;overflow:auto;font-family:Menlo,Consolas,monospace;font-size:12px;line-height:20px;}
.ms-live-log-tip{margin-top:8px;color:#888;font-size:12px;line-height:20px;}
.ms-tip-list{color:#666;line-height:28px;margin:0;padding-left:18px;}
.ms-actions .btn{margin-left:6px;}
@media(max-width:900px){.ms-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.ms-health-grid,.ms-check-grid{grid-template-columns:1fr;}}
</style>

    </div>

      <div class="soft-man-con"></div>
    </div>
  </div>
</div>
