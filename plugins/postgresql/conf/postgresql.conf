port = 5432
listen_addresses='*'
unix_socket_directories='/tmp,{$APP_PATH}'

max_connections=200
max_wal_size = 1GB
min_wal_size = 80MB
shared_buffers = 128MB
work_mem = 4MB
effective_cache_size = 4GB
temp_buffers = 8MB	
max_prepared_transactions = 0
max_stack_depth = 2MB
bgwriter_lru_maxpages = 100
max_worker_processes = 8
dynamic_shared_memory_type = posix


log_timezone = 'Asia/Shanghai'
datestyle = 'iso, ymd'
timezone = 'Asia/Shanghai'
default_text_search_config = 'pg_catalog.simple'


# 主配置
#archive_mode = on
#archive_command = 'test ! -f {$APP_PATH}/archivelog/%f && cp %p {$APP_PATH}/archivelog/%f'
#wal_level = replica
#max_wal_senders = 10
#wal_sender_timeout = 60s


# 从配置
#hot_standby = on
#primary_conninfo = 'host=192.168.0.100  port=5432  user=replica  password=123456'
#max_standby_streaming_delay = 30s
#wal_receiver_status_interval = 10s
#hot_standby_feedback = on
#recovery_target_timeline= 'latest'

logging_collector = on
log_destination = 'stderr'
log_directory = '/www/server/postgresql/logs'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
# 不记录普通 SQL
log_statement = 'none'
# 只记录执行超过 5 秒的 SQL
log_min_duration_statement = 5000
# 只输出 WARNING 及以上日志
log_min_messages = warning
# 不记录每次连接、断开，减少噪音。
log_connections = off
log_disconnections = off
# 记录 checkpoint 信息，数据库出现磁盘 IO、高延迟、卡顿时比较有用。
log_checkpoints = on
